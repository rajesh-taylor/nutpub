<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ministry of Fiat</title>
<link rel="stylesheet" href="/pub.css">
<style>
  :root { --suit: #23262e; --stripe: #6b7080; --chalk: #e9e6dc; }
  body {
    background-color: var(--suit);
    background-image: repeating-linear-gradient(90deg, transparent 0 22px, var(--stripe) 22px 23px);
    color: var(--chalk);
  }
  header { color: var(--chalk); border-color: #ffffff22; }
  .card {
    background: #1a1c22ee; border: 1px solid #ffffff22; border-radius: 16px;
    padding: 20px; margin-top: 12px; text-align: center;
  }
  .who { font-size: 64px; line-height: 1; }
  .name { font-size: 26px; margin: 8px 0 0; }
  .dept { color: #b9b4a6; font-size: 16px; }
  #try {
    width: 100%; margin-top: 18px; padding: 18px; font: inherit; font-size: 22px;
    border-radius: 12px; border: 2px solid var(--chalk); background: #2e3340; color: var(--chalk);
  }
  #try:disabled { opacity: 0.6; }
  main { text-align: center; }
  #verdict-de { color: #d9c08a; font-size: 18px; font-style: italic; min-height: 1.2em; margin: 0 0 14px; }
  #explain { font-size: 17px; line-height: 1.35; min-height: 1.3em; margin: 0 auto 12px; max-width: 30em; }
  #says { font-style: italic; min-height: 1.4em; margin: 16px 0 0; }
  #asks { color: #b9b4a6; font-size: 15px; min-height: 1.2em; }
  #verdict { color: var(--amber); font-size: 30px; line-height: 1.15; min-height: 1.2em; margin: 14px 0 6px; }
  #why { color: #b9b4a6; font: 13px/1.3 ui-monospace, Menlo, monospace; word-break: break-word; min-height: 1.3em; }
  #reset { margin-top: 18px; font-size: 14px; padding: 8px 12px; border-color: #ffffff44; color: #b9b4a6; }
  body.refused #verdict { animation: shake 0.5s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { body.refused #verdict { animation: none; } }
</style>
</head>
<body>
<header><span>🏛️ Ministry of Fiat</span><span>suit mode</span></header>
<main>
  <div class="card">
    <div class="who">🤵</div>
    <p class="name">Rupert, from the Ministry of Fiat</p>
    <p class="dept">Holder of 21 SuitCoin, freshly printed</p>
  </div>
  <button id="try"></button>
  <p id="says"></p>
  <p id="asks"></p>
  <p id="verdict" role="status"></p>
  <p id="verdict-de" lang="de"></p>
  <p id="explain"></p>
  <p id="why"></p>
  <button id="reset" class="plain">Back to the first attempt</button>
</main>
<script type="module" src="/js/rupert.js"></script>
</body>
</html>
