<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NutPub Stage</title>
<link rel="stylesheet" href="/pub.css">
<style>
  main { text-align: center; }
  #qr { background: #fff; padding: 14px; border-radius: 12px; width: min(88vw, 70vh, 640px) !important; height: auto !important; }
  .lights { display: flex; gap: 14px; justify-content: center; margin: 10px 0; }
  .lights i { width: 34px; height: 34px; border-radius: 50%; background: #141414; box-shadow: inset 0 0 0 2px #262626; transition: background .6s, box-shadow .6s; }
  .lights i.on { background: radial-gradient(circle at 40% 35%, #fff3d6, var(--amber) 55%, #8a5a1c); box-shadow: 0 0 24px 6px rgb(217 149 58 / .55); }
  body.paid .backdrop::before { background: radial-gradient(circle at 50% 38%, #f1c27a, var(--amber) 45%, #6b4310); }
  body.paid h1, body.paid .big, body.paid .kicker { color: var(--deep); text-shadow: none; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
  #room-lamps { max-width: 520px; gap: 18px; }
  #room-lamps i { width: 34px; height: 34px; }
  #room-lamps i:nth-child(3n+2) { width: 46px; height: 46px; }
  #room-lamps i:nth-child(4n+3) { width: 24px; height: 24px; }
</style>
<script src="/nav.js" defer></script>
</head>
<body data-photo="stage">
<div class="backdrop" aria-hidden="true"></div>
<p class="kicker pagename"><span data-t="stage.name">Stage</span> · <span id="float">house: … sats</span></p>
<main>
  <h1 id="headline"></h1>
  <p class="big" id="phones"></p>
  <div class="lamps" id="room-lamps" aria-hidden="true"></div>
  <div class="row">
    <button class="btn quiet" id="curtains" data-t="stage.curtains">Curtains up</button>
    <button class="btn quiet" id="newshow" data-t="stage.newshow">New show</button>
  </div>
  <section id="finale" hidden>
    <p class="big" id="goal"></p>
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p id="last-orders"></p>
  </section>
  <p class="big" id="gift-label" data-t="stage.scan">Scan for your gift</p>
  <canvas id="qr" hidden></canvas>
  <div class="row">
    <button class="btn quiet" id="gift-judge" data-t="stage.next.guest">Next gift · guest 105</button>
    <button class="btn quiet" id="gift-friend" data-t="stage.next.friend">Next gift · friend 21</button>
  </div>
  <p id="status" role="status"></p>
</main>
<div id="lights-up" hidden aria-hidden="true">
  <p class="presents">NEW MUSIC NUDGE UNIT</p>
  <div class="rig"><i></i><i></i><i></i></div>
  <div class="who"><b>LONGY</b><span data-t="lights.who">live at the NutPub</span></div>
</div>
<script type="module" src="/js/stage.js"></script>
</body>
</html>
