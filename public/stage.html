<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NutPub Stage</title>
<link rel="stylesheet" href="/pub.css">
<style>
  main { text-align: center; }
  #qr { background: #fff; padding: 14px; border-radius: 12px; width: min(88vw, 70vh, 640px) !important; height: auto !important; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<header><span>🥜🎤 The NutPub · stage</span><span id="float">house: … sats</span></header>
<main>
  <h1 id="headline">Bring 2 more friends — let’s roll!</h1>
  <p class="big"><span id="phones">0</span> phones in</p>
  <div class="row">
    <button class="plain" id="curtains">Curtains up</button>
    <button class="plain" id="newshow">New show</button>
  </div>
  <p class="big" id="gift-label">Scan for your gift</p>
  <canvas id="qr" hidden></canvas>
  <div class="row">
    <button class="plain" id="gift-judge">Next gift · judge 105</button>
    <button class="plain" id="gift-friend">Next gift · friend 21</button>
  </div>
  <p id="status" role="status"></p>
</main>
<script type="module" src="/js/stage.js"></script>
</body>
</html>
