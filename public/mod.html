<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mod · The NutPub</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    /* The Mod page (session 55e): a gig's moderators, on a laptop. The player on the left (the gig page itself, picture
       only), the chat and the mod's tools on the right. Not a widget: it needs a mod's sign-in. */
    body.board { padding: 0; text-align: left; background: #050914; font: 16px/1.45 var(--body); }
    .board-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 0 40px; border-bottom: 1px solid rgb(239 227 200 / .14); }
    .board-head .mark { font: 400 34px/1 var(--poster); letter-spacing: .08em; margin: 0; padding: 14px 0 10px; }
    .page-name { margin: 0; padding: 4px 0 2px 20px; border-left: 1px solid rgb(239 227 200 / .2); font: 400 30px/1 var(--poster); letter-spacing: .08em; color: var(--cream); }
    .gig-line { margin: 0; font-size: 15px; color: var(--smoke); }
    .head-right { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
    .head-right .linkish { margin: 0; font-size: 15px; }
    .mod-chip { padding: 5px 10px; border-radius: 4px; background: rgb(90 169 255 / .14); font: 600 14px/1.2 var(--body); color: #7db9ff; white-space: nowrap; }
    .mod-chip.nostr { background: rgb(185 140 255 / .16); color: #b98cff; }
    .mod-wrap { max-width: 1600px; margin: 0 auto; padding: 24px 40px 48px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(360px, 1fr); gap: 32px; align-items: start; }
    @media (max-width: 1000px) { .mod-wrap { grid-template-columns: minmax(0, 1fr); padding: 16px; } .board-head { padding: 0 16px; } }
    .watch { min-width: 0; }
    .tools-col { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .frame-box { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 1px solid rgb(239 227 200 / .14); border-radius: 8px; overflow: hidden; background: #000; }
    .frame-box iframe { width: 100%; height: 100%; border: 0; display: block; }
    .under { margin: 10px 0 0; font-size: 15px; color: var(--smoke); }
    .under b { color: var(--cream); font-weight: 600; }
    .chat-col { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .col-head { margin: 0; font: 400 28px/1 var(--poster); letter-spacing: .08em; color: var(--cream); }
    .pin-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border: 1px solid rgb(239 227 200 / .14); border-radius: 6px; background: rgb(11 20 38 / .6); font-size: 15px; }
    .pin-row .pin-words { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
    .pin-row .pin-words a, .lines .words a { color: #a9d0ff; }
    .pin-row .linkish { margin: 0; }
    .pin-form { display: flex; flex-wrap: wrap; gap: 8px; }
    .pin-form input { flex: 1 1 220px; min-width: 0; }
    .lines { list-style: none; margin: 0; padding: 0; border: 1px solid rgb(239 227 200 / .14); border-radius: 6px; background: rgb(11 20 38 / .6); height: calc(100dvh - 230px); min-height: 360px; overflow-y: auto; }
    @media (max-width: 1000px) { .lines { height: auto; max-height: 70vh; min-height: 0; } }
    .lines li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 7px 10px; border-bottom: 1px solid rgb(239 227 200 / .08); font-size: 15px; line-height: 1.35; }
    .lines li:last-child { border-bottom: 0; }
    .lines li.none { color: var(--smoke); }
    .lines .from { color: var(--smoke); }
    .lines .from.nostr { color: #b98cff; }
    .lines .amt { color: var(--amber); }
    .lines .mod-tag { font: 600 11px/1 var(--body); color: var(--deep); background: #7db9ff; border-radius: 3px; padding: 3px 5px; }
    .lines .words { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
    .lines .acts { margin-left: auto; display: flex; gap: 6px; }
    .lines .acts .btn { font-size: 13px; padding: 4px 10px; min-height: 30px; }
    .quiet-row { margin: 0; font-size: 15px; color: var(--cream); }
    .quiet-row .linkish { font-size: 15px; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .tools .btn { font-size: 14px; padding: 7px 12px; }
    .tools .btn[aria-pressed="true"] { border-color: #7db9ff; color: #7db9ff; }
    .tools small { font-size: 13px; color: var(--smoke); }
    .say-box { display: flex; gap: 8px; }
    .say-box input { flex: 1; min-width: 0; }
    .say-box .btn { font-size: 15px; padding: 8px 16px; }
    input.field { box-sizing: border-box; padding: 8px 10px; border: 1px solid rgb(239 227 200 / .25); border-radius: 4px; background: var(--deep); color: var(--cream); font: 15px/1.3 var(--body); }
    input.field:focus-visible { outline: 2px solid rgb(239 227 200 / .5); outline-offset: 1px; }
    .say { margin: 0; min-height: 1.3em; font-size: 14px; color: var(--smoke); }
    /* Signed out: the two ways in. */
    .out { max-width: 620px; margin: 48px auto; padding: 0 16px; display: grid; gap: 14px; justify-items: start; }
    .out h1 { margin: 0; font: 400 clamp(32px, 5vw, 44px)/1.05 var(--poster); letter-spacing: .05em; color: var(--cream); text-wrap: balance; }
    .out p { margin: 0; }
    .out .ways { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .out .ways .btn { font-size: 16px; padding: 10px 16px; }
    .out .nostr-go { background: #b98cff; border-color: #b98cff; color: #140b24; font-weight: 600; }
    .out .fine { font-size: 14px; color: var(--smoke); }
    .out .nostr-in { margin: 0; }
    .out .nostr-in.connecting { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 18px; font-size: 14px; color: var(--cream); }
    .out .nostr-in .nostr-side { flex: 1 1 240px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body class="board">
  <header class="board-head">
    <p class="mark">THE NUTPU<span class="nb" aria-hidden="true">₿</span><span class="sr">B</span></p>
    <p class="page-name">Mod</p>
    <p class="gig-line" id="gig-line"></p>
    <span class="head-right" id="head-right" hidden>
      <span class="mod-chip" id="who"></span>
      <a class="linkish" id="to-gig" href="/" target="_blank" rel="noopener">Gig page ↗</a>
      <button type="button" class="linkish" id="sign-out" hidden>Sign out</button>
    </span>
  </header>

  <main class="out" id="out" hidden>
    <h1 id="out-head">Moderate the chat</h1>
    <p id="out-say">Sign in the way you said yes to the invite.</p>
    <p class="ways">
      <button type="button" class="btn nostr-go" id="nostr-go">Nostr Sign In</button>
      <a class="btn quiet" id="passkey-go" href="/crew" hidden>Use my passkey</a>
    </p>
    <div class="nostr-in" id="nostr-in" hidden></div>
    <p class="say" id="out-status" role="status"></p>
    <p class="fine" id="out-fine"></p>
  </main>

  <div class="mod-wrap" id="page" hidden>
    <!-- Rajesh 23 Nov: the player and the mod's own tools on the left; the chat on the right at full height, to see
         more lines at a glance. -->
    <section class="watch" aria-label="The gig and your tools">
      <div class="frame-box"><iframe id="player" title="The gig, as on the gig page" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      <p class="under" id="under"></p>
      <p class="under" id="player-say" role="status" hidden></p>
      <p class="under" id="under-free" hidden>You’re on: comments are free while this page is open.</p>
      <div class="tools-col">
        <div class="pin-row" id="pin-row" hidden>
          <span aria-hidden="true">📌</span><span class="pin-words" id="pin-words"></span>
          <button type="button" class="linkish" id="pin-change" hidden>Change</button>
        </div>
        <form class="pin-form" id="pin-form" hidden>
          <input class="field" id="pin-input" maxlength="140" autocomplete="off" aria-label="The pinned message" placeholder="Pinned over the chat: 140 characters, links work">
          <button type="submit" class="btn primary">Pin it</button>
          <button type="button" class="btn quiet" id="pin-down" hidden>Take it down</button>
          <button type="button" class="btn quiet" id="pin-cancel">Cancel</button>
        </form>
        <div class="tools">
          <button type="button" class="btn quiet" id="slow-btn" aria-pressed="false">Slow mode · off</button>
          <button type="button" class="btn quiet" id="pin-add" hidden>Pin a message</button>
          <small id="slow-note">A busy chat turns slow mode on by itself.</small>
        </div>
        <form class="say-box" id="say-form">
          <input class="field" id="say-text" maxlength="140" autocomplete="off" placeholder="Say something to the chat (links work)" aria-label="A message to the chat">
          <button type="submit" class="btn primary">Send</button>
        </form>
        <p class="say" id="say" role="status"></p>
      </div>
    </section>
    <section class="chat-col" aria-label="The chat">
      <p class="col-head">The chat</p>
      <ol class="lines" id="lines" aria-live="polite"></ol>
      <p class="quiet-row" id="quiet-row" hidden><span id="quiet-text"></span> · <button type="button" class="linkish" id="undo">Undo</button></p>
    </section>
  </div>

  <script type="module" src="/js/mod.js"></script>
</body>
</html>
