<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NutPub Bar</title>
<link rel="stylesheet" href="/pub.css">
<style>
  main { text-align: center; }
  #pour { font: 400 44px/1 var(--poster); letter-spacing: .1em; padding: 20px 48px; margin-top: 30px; }
  #verdict { font: 400 56px/.95 var(--poster); letter-spacing: .02em; text-transform: uppercase; color: var(--amber); margin: 30px 0 10px; }
  #sub { color: var(--smoke); }
  body.poured { background: #1b1200; transition: background 1s; }
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<p class="kicker pagename" data-t="bar.name">The bar</p>
<main>
  <button id="pour" class="btn" data-t="bar.pour">Pour it</button>
  <p id="verdict" role="status"></p>
  <p id="sub"></p>
  <p style="margin-top:36px"><a class="btn quiet" href="/" data-t="closing.back">Back to the pub</a></p>
</main>
<script type="module" src="/js/bar.js"></script>
</body>
</html>
