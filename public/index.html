<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <title>The NutPub</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="viewer">
  <main>
    <h1 class="wordmark small-mark">THE NUTPUB</h1>
    <p class="tag" id="billing"></p>

    <div class="player" id="player">
      <video id="vid-a" muted playsinline preload="auto"></video>
      <video id="vid-b" muted playsinline preload="auto"></video>
      <button class="big-play" id="big-play" aria-label="Play">▶</button>
      <div class="overlay" id="overlay">
        <button class="btn" id="ov-stop">Stop</button>
        <button class="btn" id="ov-tip"></button>
      </div>
    </div>

    <p class="meter"><span id="price"></span><span id="spent"></span></p>

    <p class="buttons">
      <button class="btn primary" id="play" disabled>Play</button>
      <button class="btn" id="tip" disabled></button>
    </p>

    <p class="pocketline"><span id="pocket">Opening your pocket…</span>
      <button class="btn quiet" id="topup" hidden>Top up 100 test sats</button>
      <a class="btn quiet" href="/pocket.html" id="pocket-link" hidden>Pocket</a></p>

    <p class="status" id="status" role="status"></p>
  </main>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
