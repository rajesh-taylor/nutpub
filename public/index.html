<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The NutPub</title>
<link rel="stylesheet" href="/pub.css">
</head>
<body>
<header><span>🥜🎤 The NutPub</span><span id="balance">… sats</span></header>

<main>
  <section id="loading" data-screen><p>Opening the doors…</p></section>

  <section id="door" data-screen hidden>
    <h1>If your sats ain’t signed, you ain’t coming in!</h1>
    <p class="de" lang="de">Ohne Signatur kein Eintritt!</p>
    <button id="judge" class="tier">
      <strong>Ecash Idol Judges</strong><span id="judge-price"></span>
    </button>
    <button id="pleb" class="tier">
      <strong>Plebs</strong><span id="pleb-price"></span>
    </button>
    <p class="small">The door takes NutPub Mint ecash only. No names, no list.</p>
  </section>

  <section id="inside" data-screen hidden>
    <h1>You’re in.</h1>
    <p class="big" id="in-tier"></p>
    <p class="big" id="curtain">Curtains up soon.</p>
    <button id="pint" class="tier pint"><strong>🍺 Free pint</strong><span>First one’s on the house. Show the QR at the bar.</span></button>
    <canvas id="pint-qr" hidden></canvas>
    <div id="stream" hidden>
      <button id="stop" class="plain">⏸ Stop paying</button>
      <ul id="ticks"></ul>
    </div>
  </section>

  <p id="status" role="status"></p>
</main>
<div id="pint-signal" hidden><div class="glass"><div class="beer"></div><span>🍺</span></div><p>Poured. Cheers!</p></div>
<script type="module" src="/js/fan.js"></script>
</body>
</html>
