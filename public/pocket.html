<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <title>Pocket · The NutPub</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="pocket">
  <main>
    <h1 class="wordmark">THE NUTPUB</h1>
    <p class="tag">Pocket</p>
    <p class="big"><span id="balance">…</span> <small>sats</small></p>
    <p class="small" id="mint"></p>
    <div id="actions" hidden>
      <p class="buttons"><button class="btn" id="topup">Top up 100 test sats</button><button class="btn" id="home">Take it home</button></p>
      <div id="takeout" hidden>
        <textarea id="token" rows="4" readonly aria-label="Your ecash note"></textarea>
        <p><button class="btn" id="copy">Copy</button></p>
      </div>
      <p class="small">Your sats live in this browser, at <b id="where"></b>. Closing the tab is fine.
        Clearing your browsing data, a private window, another browser or phone, or (on iPhone) 7 days without a visit
        lose them: <b>take them home</b> first.</p>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>
  <script type="module" src="/js/pocket.js"></script>
</body>
</html>
