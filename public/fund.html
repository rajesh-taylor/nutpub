<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NutPub Float</title>
<link rel="stylesheet" href="/pub.css">
<style>
  main { text-align: center; }
  #qr { background: #fff; padding: 12px; border-radius: 12px; width: min(86vw, 380px) !important; height: auto !important; }
  #inv { word-break: break-all; font: 12px var(--mono); color: var(--smoke); }
  input { font: inherit; width: 8em; padding: 10px; border: 1.5px solid var(--amber); background: rgb(5 9 20 / .6); color: var(--cream); text-align: center; }
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<p class="kicker pagename">House float · <span id="float">… sats</span></p>
<main>
  <h1>Top up the house</h1>
  <p><input id="amount" type="number" value="3000" min="1" max="10000"> sats
  <button class="btn quiet" id="go">Make invoice</button></p>
  <canvas id="qr" hidden></canvas>
  <p id="inv"></p>
  <button class="btn quiet" id="copy" hidden>Copy invoice</button>
  <p id="status" role="status"></p>
</main>
<script type="module" src="/js/fund.js"></script>
</body>
</html>
